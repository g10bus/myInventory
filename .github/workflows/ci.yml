name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SETTINGS_MODULE: config.settings.test
  DJANGO_SECRET_KEY: ci-secret-key
  DATABASE_URL: sqlite:///./var/ci.sqlite3
  DJANGO_LOG_LEVEL: WARNING

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/prod.txt

      - name: Validate Docker Compose config
        run: docker compose -f compose.prod.yaml config

      - name: Prepare runtime dirs
        run: mkdir -p var var/static var/media var/artifacts

      - name: Validate dependency graph
        run: python -m pip check

      - name: Django system checks
        run: python manage.py check

      - name: Verify no missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Bootstrap roles
        run: python manage.py bootstrap_roles

      - name: Collect static assets
        run: python manage.py collectstatic --noinput

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/prod.txt coverage

      - name: Prepare runtime dirs
        run: mkdir -p var var/static var/media var/artifacts

      - name: Run Django tests with coverage
        run: |
          python -m coverage run --branch manage.py test -v 2 \
            apps.core.tests \
            apps.custody.tests \
            apps.integrations.tests \
            apps.inventory.tests
          python -m coverage report --show-missing --skip-covered | tee var/artifacts/coverage.txt
          python -m coverage xml -o var/artifacts/coverage.xml

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            var/artifacts/coverage.txt
            var/artifacts/coverage.xml
          if-no-files-found: error

  container-smoke:
    name: Container Smoke
    runs-on: ubuntu-latest
    needs:
      - quality
      - tests
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env file
        run: cp .env.example .env

      - name: Build image
        run: docker build --tag myinventory:ci .

      - name: Start application stack
        run: docker compose -f compose.prod.yaml up --build -d

      - name: Wait for readiness endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready in time" >&2
          exit 1

      - name: Verify live endpoint
        run: curl --fail --silent http://127.0.0.1:8000/health/live/

      - name: Verify ready endpoint
        run: curl --fail --silent http://127.0.0.1:8000/health/ready/

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f compose.prod.yaml logs --no-color

      - name: Stop application stack
        if: always()
        run: docker compose -f compose.prod.yaml down -v
