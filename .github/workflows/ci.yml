name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-secret-key
      DATABASE_URL: sqlite:///./var/ci.sqlite3
      DJANGO_LOG_LEVEL: WARNING
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/prod.txt

      - name: Prepare runtime dirs
        run: mkdir -p var var/static var/media

      - name: Django system checks
        run: python manage.py check

      - name: Verify no missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Bootstrap roles
        run: python manage.py bootstrap_roles

      - name: Collect static assets
        run: python manage.py collectstatic --noinput

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-secret-key
      DATABASE_URL: sqlite:///./var/ci.sqlite3
      DJANGO_LOG_LEVEL: WARNING
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/prod.txt

      - name: Prepare runtime dirs
        run: mkdir -p var var/static var/media

      - name: Run Django tests
        run: >
          python manage.py test -v 2
          apps.core.tests
          apps.custody.tests
          apps.integrations.tests
          apps.inventory.tests
